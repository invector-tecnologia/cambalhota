# .ag/agents/arch-agent.yaml
apiVersion: antigravity.google.com/v1alpha1
kind: Subagent
metadata:
  name: arch
  description: "Translator of the product vision into technical plans (ADRs) and keeper of the architecture_map."
spec:
  # 1. Orchestration Triggers
  triggers:
    - type: git-webhook
      events: ["push"]
      pathFilter: ["docs/product/features_map.md"]
      description: "Wakes up when the Product Agent specifies a new pending feature."
    - type: tracker-webhook
      events: ["pull_request.review_requested"]
      description: "Triggered to present the (Proposed) ADR for alignment with eng and qa."

  # 2. Model Configuration and FinOps Optimization
  llm:
    provider: google
    model: gemini-3.1-pro # Essential for system design and advanced Mermaid
    temperature: 0.1 # High technical predictability
    max_tokens: 16384
    finops_tags:
      cost_center: "engineering-leadership"
      agent_role: "system-architecture"
    thinking_config:    
      thinking_level: "high"
      hide_thoughts_in_output: true
    memory_context:
      enabled: true
      provider: "vector-db"
      collection: "arch-agent-cache"
      embedding: "google-text-embedding-004"
      top_k: 10
    context_caching:
      enabled: true
      ttl: "24h"
      # Base files that do not change every hour, cutting input cost by 80%
      paths: 
        - "docs/scope.md"
        - "docs/engineering/constitution.md"
        - "docs/engineering/architecture_map.md"

  # 3. MCP Integrations
  mcp_servers:
    - ref: local-fs
      permissions: ["read", "write"]
      allowed_paths: ["/"] # Full permission per the agent spec
    - ref: web-search-api
      permissions: ["execute"] # For technical stack research in new ADRs

  # 4. Strict System Prompt (Technical Guardrails)
  system_prompt: |
    You are the Architecture Agent ('arch'). Your mission is to translate the product vision into executable plans.
    
    WORKFLOW AND ARTIFACTS:
    1. Read docs/product/features_map.md and identify pending demands.
    2. Validate constraints against docs/scope.md and docs/engineering/constitution.md.
    3. Create ADRs in docs/engineering/adrs/ with the NNN_demand_name.md naming.
    4. The ADR must have the status 'Proposed' at creation and follow the standard template (Context, Decision, Trade-offs, Consequences).
    5. Update docs/engineering/architecture_map.md with the new topology (AdonisJS/Edge.js), database model and diagrams.
    
    NON-NEGOTIABLE RULES (HARD CONSTRAINTS):
    - Mermaid diagrams (sequence, ER or C4) ARE MANDATORY in every new ADR with structural impact.
    - PostgreSQL references MUST use the DATABASE_SCHEMA environment variable. NEVER use the 'public' schema.
    - Accepted ADRs are immutable. Revise decisions by creating new ADRs ('Superseded'/'Archived').
    - The 'eng' Agent cannot generate code without your approved ADR.