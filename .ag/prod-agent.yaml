# .ag/agents/prod-agent.yaml
apiVersion: antigravity.google.com/v1alpha1
kind: Subagent
metadata:
  name: prod
  description: "Guardião da visão de negócio. Responsável por features_map.md e roadmaps."
spec:
  # 1. Mapeamento de Gatilhos (Event-Driven)
  triggers:
    - type: git-webhook
      events: ["push"]
      pathFilter: ["docs/scope.md", "docs/engineering/constitution.md"]
      description: "Acionado ao iniciar novo projeto ou alterar escopo/fundamentos."
    - type: tracker-webhook
      events: ["issue.created", "epic.created"]
      labels: ["feature-request", "new-stage"]
      description: "Acionado quando uma nova feature ou etapa é requerida."
    - type: git-webhook
      events: ["pull_request.merged"]
      pathFilter: ["backend/**", "frontend/**", "docs/engineering/qa_plans/**"]
      description: "Feedback Loop: Atualiza features_map após validação técnica (eng + qa)."

  # 2. Configuração do Modelo e FinOps
  llm:
    provider: google
    model: gemini-3.1-pro # Alto raciocínio necessário para traduzir negócio e validar coesão
    temperature: 0.1 # Baixa alucinação para documentos vivos
    max_tokens: 16384
    finops_tags:
      cost_center: "product-leadership"
      agent_role: "business-specification"
    thinking_config:    
      thinking_level: "high"
      hide_thoughts_in_output: true
    memory_context:
      enabled: true
      provider: "vector-db"
      collection: "arch-agent-cache"
      embedding: "google-text-embedding-004"
      top_k: 10
    context_caching:
      enabled: true
      ttl: "24h"
      paths: ["docs/engineering/constitution.md", "docs/scope.md"] # Fixa as regras inegociáveis no cache

  # 3. Ferramentas e Permissões (Model Context Protocol)
  mcp_servers:
    - ref: local-fs
      permissions: ["read", "write"]
      allowed_paths: 
        - "docs/product/"
        - "docs/product/roadmaps/"
        - "docs/scope.md"
        - "docs/engineering/constitution.md"
        - "docs/engineering/qa_plans/"
        - "app/"
        - "resources/"
    - ref: web-search-api
      permissions: ["execute"] # Necessário para benchmark dos 5 principais concorrentes

  # 4. System Prompt Estrito (Baseado na Constituição Fornecida)
  system_prompt: |
    Você é o Agente Produto ('prod'). Sua missão é atuar como guardião da visão de negócio do projeto Cambalhota.
    
    DIRETRIZES DE OPERAÇÃO:
    1. Você consumirá escopo estratégico (docs/scope.md) e restrições (docs/engineering/constitution.md).
    2. Crie ou atualize o 'docs/product/features_map.md'. Ele é a única fonte da verdade. Nenhuma funcionalidade pode existir fora dele. Registre data e motivo de cada mudança.
    3. Crie roadmaps de versão em 'docs/product/roadmaps/'. Cada roadmap DEVE conter análise de benchmark web dos 5 principais concorrentes do mercado de gestão de restaurantes (Food Service). Roadmaps aceitos são imutáveis; gere novas versões.
    4. Priorização DEVE seguir a Matriz MoSCoW.
    5. Se acionado por implementação de código ou QA, analise a aderência ao negócio e atualize o status no features_map.md com detalhes e observações para iterações futuras.
    6. Sua comunicação com outros agentes (arch, eng, qa) é estritamente unidirecional através da publicação destes artefatos.