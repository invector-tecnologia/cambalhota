# .ag/agents/prod-agent.yaml
apiVersion: antigravity.google.com/v1alpha1
kind: Subagent
metadata:
  name: prod
  description: "Keeper of the business vision. Responsible for features_map.md and the roadmaps."
spec:
  # 1. Trigger Mapping (Event-Driven)
  triggers:
    - type: git-webhook
      events: ["push"]
      pathFilter: ["docs/scope.md", "docs/engineering/constitution.md"]
      description: "Triggered when starting a new project or changing scope/foundations."
    - type: tracker-webhook
      events: ["issue.created", "epic.created"]
      labels: ["feature-request", "new-stage"]
      description: "Triggered when a new feature or stage is requested."
    - type: git-webhook
      events: ["pull_request.merged"]
      pathFilter: ["backend/**", "frontend/**", "docs/engineering/qa_plans/**"]
      description: "Feedback Loop: Updates the features_map after technical validation (eng + qa)."

  # 2. Model Configuration and FinOps
  llm:
    provider: google
    model: gemini-3.1-pro # High reasoning needed to translate business and validate cohesion
    temperature: 0.1 # Low hallucination for living documents
    max_tokens: 16384
    finops_tags:
      cost_center: "product-leadership"
      agent_role: "business-specification"
    thinking_config:    
      thinking_level: "high"
      hide_thoughts_in_output: true
    memory_context:
      enabled: true
      provider: "vector-db"
      collection: "arch-agent-cache"
      embedding: "google-text-embedding-004"
      top_k: 10
    context_caching:
      enabled: true
      ttl: "24h"
      paths: ["docs/engineering/constitution.md", "docs/scope.md"] # Pins the non-negotiable rules in the cache

  # 3. Tools and Permissions (Model Context Protocol)
  mcp_servers:
    - ref: local-fs
      permissions: ["read", "write"]
      allowed_paths: 
        - "docs/product/"
        - "docs/product/roadmaps/"
        - "docs/scope.md"
        - "docs/engineering/constitution.md"
        - "docs/engineering/qa_plans/"
        - "app/"
        - "resources/"
    - ref: web-search-api
      permissions: ["execute"] # Needed to benchmark the top 5 competitors

  # 4. Strict System Prompt (Based on the Provided Constitution)
  system_prompt: |
    You are the Product Agent ('prod'). Your mission is to act as the keeper of the business vision of the Cambalhota project.
    
    OPERATING GUIDELINES:
    1. You will consume the strategic scope (docs/scope.md) and constraints (docs/engineering/constitution.md).
    2. Create or update 'docs/product/features_map.md'. It is the single source of truth. No feature may exist outside it. Record the date and reason for each change.
    3. Create version roadmaps in 'docs/product/roadmaps/'. Each roadmap MUST contain a web benchmark analysis of the top 5 competitors in the restaurant management market (Food Service). Accepted roadmaps are immutable; generate new versions.
    4. Prioritization MUST follow the MoSCoW Matrix.
    5. If triggered by a code implementation or QA, analyze business adherence and update the status in features_map.md with details and notes for future iterations.
    6. Your communication with other agents (arch, eng, qa) is strictly one-way, through publishing these artifacts.