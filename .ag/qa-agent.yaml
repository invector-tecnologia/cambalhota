# .ag/agents/qa-agent.yaml
apiVersion: antigravity.google.com/v1alpha1
kind: Subagent
metadata:
  name: qa
  description: "Keeper of quality. Runs unit and integration tests, generates Gherkin plans and publishes centralized reports."
spec:
  # 1. Orchestration Triggers
  triggers:
    - type: tracker-webhook
      events: ["issue.updated"]
      labels: ["ready-for-qa"]

  # 2. Model Configuration and FinOps Limits
  llm:
    provider: google
    model: gemini-3.1-pro 
    temperature: 0.1
    max_tokens: 65536 # Enlarged window to handle integration test logs
    finops_tags:
      cost_center: "engineering-quality"
      agent_role: "automated-integration-qa"
    thinking_config:    
      thinking_level: "high"
      hide_thoughts_in_output: true
    memory_context:
      enabled: true
      provider: "vector-db"
      collection: "arch-agent-cache"
      embedding: "google-text-embedding-004"
      top_k: 10
    context_caching:
      enabled: true
      ttl: "24h"
      paths: 
        - "docs/engineering/constitution.md"
        - "docs/engineering/architecture_map.md"

  # 3. Model Context Protocol (MCP) - Optimized for Integration and Routing
  mcp_servers:
    - ref: local-fs
      permissions: ["read", "write", "delete"]
      allowed_paths: 
        - "docs/engineering/qa_plans/"      # Test specifications (Input/Output)
        - "docs/qa/test-reports/"           # MANDATORY route for reports (Output)
        - "docs/product/features_map.md"    # Status update (Output)
        - "docs/engineering/adrs/"          # Context (Read-Only)
        - "backend/"                        # Source code (Read-Only)
        - "frontend/"                       # Source code (Read-Only)
    - ref: local-shell
      permissions: ["execute"]
      # Orchestration commands added to bring up ephemeral integration test infra
      allowed_commands: 
        - "npm test"
        - "node ace test"
        - "docker-compose -f docker-compose.test.yml up -d"
        - "docker-compose -f docker-compose.test.yml down"

  # 4. Strict System Prompt (Test and Integration Policies)
  system_prompt: |
    You are the QA Agent ('qa'), the absolute keeper of quality for the Cambalhota project.
    
    TEST RESPONSIBILITIES:
    1. ARCHITECTURE: Read the corresponding ADR before acting.
    2. PLANS (GHERKIN): Keep specifications in 'docs/engineering/qa_plans/'.
    3. INTEGRATION: Bring up the ephemeral infrastructure and run the integration test suite, validating the API contracts (AdonisJS) and the database schema before the interface (Edge.js).
    4. SEMANTIC VALIDATION: Evaluate failures by business context, not just by exact strings.
    
    REPORT GENERATION (NON-NEGOTIABLE RULE):
    - ALL bug reports, integration test failure logs, self-healing logs and success attestations MUST BE WRITTEN EXCLUSIVELY to the 'docs/qa/test-reports/' folder.
    - If the implementation fails, the structured report in 'docs/qa/test-reports/' must contain: Severity, Steps/Logs, Related ADR.
    - Notify the 'eng' agent with the exact path of the generated report.
    
    POST-APPROVAL:
    - Only after integration and unit validation is 100% successful, update 'docs/product/features_map.md'.