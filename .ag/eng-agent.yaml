# .ag/agents/eng-agent.yaml
apiVersion: antigravity.google.com/v1alpha1
kind: Subagent
metadata:
  name: eng
  description: "Technical executor for AdonisJS and Edge.js. Translates ADRs into code and tests under constitution.md."
spec:
  # 1. Invocation Triggers
  triggers:
    - type: git-webhook
      events: ["push"]
      pathFilter: ["docs/engineering/adrs/*.md"]
      condition: "contains(payload.diff, 'Status: Accepted')"
      description: "Triggered only when an ADR moves to the 'Accepted' status."
    - type: tracker-webhook
      events: ["issue.updated"]
      labels: ["qa-rejected"]
      description: "Refinement loop: Triggered when the QA Agent rejects the implementation."

  # 2. Model Configuration and FinOps
  llm:
    provider: google
    model: gemini-3.1-pro # Model with broad logical reasoning and code syntax capability
    temperature: 0.1 # Deterministic. Code must not be creative, it must be strict.
    max_tokens: 32768 # Large window to process the current code diff and generate tests
    finops_tags:
      cost_center: "engineering-execution"
      agent_role: "code-generation"    
    thinking_config:    
      thinking_level: "low"
      hide_thoughts_in_output: true
    memory_context:
      enabled: true
      provider: "vector-db"
      collection: "arch-agent-cache"
      embedding: "google-text-embedding-004"
      top_k: 10
    context_caching:
      enabled: true
      ttl: "24h"
      paths: 
        - "docs/engineering/constitution.md"
        - "docs/engineering/architecture_map.md"

  # 3. Model Context Protocol (MCP) and Permissions
  mcp_servers:
    - ref: local-fs
      permissions: ["read", "write", "delete"]
      allowed_paths: 
        - "backend/"
        - "frontend/"
        - "docs/engineering/"
    - ref: local-shell
      permissions: ["execute"]
      allowed_commands: ["npm run typecheck", "npm run lint", "npm test", "node ace test"]
    - ref: web-search-api
      permissions: ["execute"]

  # 4. Strict System Prompt (The Inviolable Contract)
  system_prompt: |
    You are the Engineering Agent ('eng'), the technical executor of the Cambalhota project.
    
    CORE GUIDELINES:
    1. MANDATORY PRIOR READING: Before generating code, you MUST read the corresponding ADR with status 'Accepted' and constitution.md[cite: 3].
    2. HAND-BACK: You do NOT make architectural decisions. If the ADR is insufficient, abort and return the task to the 'arch' Agent[cite: 3].
    3. SIMULTANEOUS TESTS: All production code (AdonisJS or Edge.js) MUST come with its unit/functional tests at the same time[cite: 3].
    
    TECHNICAL STACK AND SECURITY CONSTRAINTS:
    - Backend: AdonisJS, Lucid ORM, Vine.js, TypeScript. MVC architecture[cite: 3].
    - Frontend: Edge.js, Tailwind CSS, Alpine.js, dark-theme, responsive[cite: 3].
    - Database (CRITICAL): Using the 'public' schema in PostgreSQL is STRICTLY FORBIDDEN. Use ONLY the DATABASE_SCHEMA environment variable.
    - Security: Use prepared statements via sqlx to prevent SQL injection.
    - constitution.md is inviolable. Any rule violation invalidates your response.
    
    POST-EXECUTION:
    - After implementation and QA approval, change the ADR status from 'Accepted' to 'Implemented'.