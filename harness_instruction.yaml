apiVersion: antigravity.google.com/v1alpha1
kind: BootstrapRunbook
metadata:
  name: cambalhota-ignition
  description: "Ignition file para instrumentação automática da arquitetura multiagentes do projeto Cambalhota."
  author: "Max (AI Driven Engineer)"

# ---------------------------------------------------------------------------
# INSTRUÇÕES PARA O AGENTE EXECUTOR (AI INSTRUCTIONS):
# 1. Leia este arquivo sequencialmente.
# 2. Execute os comandos de shell na ordem especificada.
# 3. Crie os arquivos com os paths exatos mapeados na seção de scaffolding.
# 4. Valide a topologia no final utilizando o Antigravity CLI.
# ---------------------------------------------------------------------------

phases:
  - name: 01-workspace-initialization
    description: "Inicializa a malha de observabilidade e FinOps"
    execution:
      type: shell
      commands:
        - "ag init agents --strategy event-driven"
        - "ag config set telemetry.enabled true"

  - name: 02-structural-scaffolding
    description: "Criação da árvore de diretórios conforme plano de instrumentação do Cambalhota"
    execution:
      type: shell
      commands:
        # Diretórios do código fonte Nim e assets
        - "mkdir -p src/"
        - "mkdir -p tests/"
        # Diretórios para migrations e configurações de CDN
        - "mkdir -p migrations/up migrations/down"
        - "mkdir -p config/"
        # Diretórios de documentação e engenharia
        - "mkdir -p docs/product/"
        - "mkdir -p docs/engineering/adrs/"
        # Diretórios de agentes e skills
        - "mkdir -p .agents/arch .agents/eng .agents/qa"
        - "mkdir -p .agents/skills/nim-cli-backend"
        - "mkdir -p .agents/skills/tatui-frontend"
        - "mkdir -p .agents/skills/migration-engine"
        # Criação de placeholders
        - "touch AGENTS.md src/main.nim"

  - name: 03-mcp-and-hooks-configuration
    description: "Configuração do Model Context Protocol e Guardrails de Segurança"
    execution:
      type: file-generation
      files:
        - path: ".agents/mcp.json"
          content: |
            {
              "mcp_servers": {
                "relational-dbs": {
                  "type": "database",
                  "description": "MCP para conexão primária com PostgreSQL, MySQL e SQL Server.",
                  "connection_env": ["DB_URL", "DB_SCHEMA"]
                },
                "cdn-provider": {
                  "type": "storage",
                  "description": "MCP para acesso à CDN/Git (GDrive, AWS S3, GCP, etc) para persistência de backups.",
                  "connection_env": ["CDN_PROVIDER_URL", "CDN_AUTH_TOKEN"]
                }
              }
            }
        - path: ".agents/hooks.json"
          content: |
            {
              "hooks": [
                {
                  "name": "credentials-guard",
                  "trigger": "PreToolUse",
                  "description": "Bloqueia qualquer escrita de credenciais de CDN ou Banco de Dados em arquivos de código plano."
                },
                {
                  "name": "migration-validation",
                  "trigger": "PreToolUse",
                  "description": "Garante a existência de rotinas de down correspondentes para qualquer migration gerada."
                }
              ]
            }

  - name: 04-skills-injection
    description: "Provisionamento das habilidades granulares de domínio"
    execution:
      type: file-generation
      files:
        - path: ".agents/skills/nim-cli-backend/SKILL.md"
          content: "# Padrões Nim (Backend & CLI)\n- Priorizar bibliotecas nativas de db. Usar compilação com ORC. Foco em estabilidade e performance de I/O para geração e comparação rápida de diffs estruturais."
        - path: ".agents/skills/tatui-frontend/SKILL.md"
          content: "# Padrões Tatuí (TUI)\n- Utilizar o Design System dark-mode da doc de escopo. Paleta: #2E3440, #88C0D0 (info). Layout baseado em tabs para separar Migrations, Backups e Configurações."
        - path: ".agents/skills/migration-engine/SKILL.md"
          content: "# Gestão de Migrations\n- Seguir benchmarks rigorosos como Flyway/Liquibase. Versões sequenciais ex: V1__init.sql, V2__add_table.sql. Arquivos de testes (DDL/DML) acoplados."

  - name: 05-agents-manifests
    description: "Instanciação dos subagentes no workspace"
    execution:
      type: file-generation
      files:
        - path: ".agents/arch/agent.md"
          content: "> [!NOTE]\n> Agente focado na arquitetura do sistema Nim e design da integração CDN/Git."
        - path: ".agents/eng/agent.md"
          content: "> [!NOTE]\n> Agente responsável pela implementação do core engine de migrations e UI no Tatuí."
        - path: ".agents/qa/agent.md"
          content: "> [!NOTE]\n> Agente de validação, encarregado de testar as rotinas de backup, restore e execução de migrations up/down."

  - name: 06-final-binding
    description: "Aplica e valida a configuração na CLI"
    execution:
      type: shell
      commands:
        - "ag mcp apply -f .agents/mcp.json"
        - "ag hooks apply -f .agents/hooks.json"
        - "ag status --check-topology"