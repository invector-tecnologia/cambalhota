apiVersion: antigravity.google.com/v1alpha1
kind: BootstrapRunbook
metadata:
  name: cambalhota-ignition
  description: "Ignition file for automatic instrumentation of the Cambalhota project's multi-agent architecture."
  author: "Max (AI Driven Engineer)"

# ---------------------------------------------------------------------------
# INSTRUCTIONS FOR THE EXECUTING AGENT (AI INSTRUCTIONS):
# 1. Read this file sequentially.
# 2. Run the shell commands in the specified order.
# 3. Create the files with the exact paths mapped in the scaffolding section.
# 4. Validate the topology at the end using the Antigravity CLI.
# ---------------------------------------------------------------------------

phases:
  - name: 01-workspace-initialization
    description: "Initializes the observability and FinOps mesh"
    execution:
      type: shell
      commands:
        - "ag init agents --strategy event-driven"
        - "ag config set telemetry.enabled true"

  - name: 02-structural-scaffolding
    description: "Creates the directory tree according to the Cambalhota instrumentation plan"
    execution:
      type: shell
      commands:
        # Nim source code and asset directories
        - "mkdir -p src/"
        - "mkdir -p tests/"
        # Directories for migrations and CDN settings
        - "mkdir -p migrations/up migrations/down"
        - "mkdir -p config/"
        # Documentation and engineering directories
        - "mkdir -p docs/product/"
        - "mkdir -p docs/engineering/adrs/"
        # Agent and skill directories
        - "mkdir -p .agents/arch .agents/eng .agents/qa"
        - "mkdir -p .agents/skills/nim-cli-backend"
        - "mkdir -p .agents/skills/tatui-frontend"
        - "mkdir -p .agents/skills/migration-engine"
        # Placeholder creation
        - "touch AGENTS.md src/main.nim"

  - name: 03-mcp-and-hooks-configuration
    description: "Model Context Protocol and Security Guardrails configuration"
    execution:
      type: file-generation
      files:
        - path: ".agents/mcp.json"
          content: |
            {
              "mcp_servers": {
                "relational-dbs": {
                  "type": "database",
                  "description": "MCP for the primary connection to PostgreSQL, MySQL and SQL Server.",
                  "connection_env": ["DB_URL", "DB_SCHEMA"]
                },
                "cdn-provider": {
                  "type": "storage",
                  "description": "MCP for CDN/Git access (GDrive, AWS S3, GCP, etc) for backup persistence.",
                  "connection_env": ["CDN_PROVIDER_URL", "CDN_AUTH_TOKEN"]
                }
              }
            }
        - path: ".agents/hooks.json"
          content: |
            {
              "hooks": [
                {
                  "name": "credentials-guard",
                  "trigger": "PreToolUse",
                  "description": "Blocks any writing of CDN or Database credentials into plain code files."
                },
                {
                  "name": "migration-validation",
                  "trigger": "PreToolUse",
                  "description": "Ensures matching down routines exist for any generated migration."
                }
              ]
            }

  - name: 04-skills-injection
    description: "Provisioning of the granular domain skills"
    execution:
      type: file-generation
      files:
        - path: ".agents/skills/nim-cli-backend/SKILL.md"
          content: "# Nim Standards (Backend & CLI)\n- Prefer native db libraries. Use ORC compilation. Focus on I/O stability and performance for fast generation and comparison of structural diffs."
        - path: ".agents/skills/tatui-frontend/SKILL.md"
          content: "# Tatuí Standards (TUI)\n- Use the dark-mode Design System from the scope doc. Palette: #2E3440, #88C0D0 (info). Tab-based layout to separate Migrations, Backups and Settings."
        - path: ".agents/skills/migration-engine/SKILL.md"
          content: "# Migration Management\n- Follow rigorous benchmarks such as Flyway/Liquibase. Sequential versions e.g.: V1__init.sql, V2__add_table.sql. Coupled test files (DDL/DML)."

  - name: 05-agents-manifests
    description: "Instantiates the subagents in the workspace"
    execution:
      type: file-generation
      files:
        - path: ".agents/arch/agent.md"
          content: "> [!NOTE]\n> Agent focused on the Nim system architecture and the design of the CDN/Git integration."
        - path: ".agents/eng/agent.md"
          content: "> [!NOTE]\n> Agent responsible for implementing the core migration engine and the UI in Tatuí."
        - path: ".agents/qa/agent.md"
          content: "> [!NOTE]\n> Validation agent, in charge of testing the backup, restore and up/down migration execution routines."

  - name: 06-final-binding
    description: "Applies and validates the configuration in the CLI"
    execution:
      type: shell
      commands:
        - "ag mcp apply -f .agents/mcp.json"
        - "ag hooks apply -f .agents/hooks.json"
        - "ag status --check-topology"