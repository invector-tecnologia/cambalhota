apiVersion: antigravity.google.com/v1alpha1
kind: BootstrapRunbook
metadata:
  name: tavolo-ai-driven-ignition
  description: "Ignition file para instrumentação automática da arquitetura multiagentes do projeto Tavolo (Restaurant ERP)."
  author: "Bernardo Rosmaninho"

# ---------------------------------------------------------------------------
# INSTRUÇÕES PARA O AGENTE EXECUTOR (AI INSTRUCTIONS):
# 1. Leia este arquivo sequencialmente.
# 2. Execute os comandos de shell na ordem especificada.
# 3. Crie os arquivos com os paths exatos mapeados na seção de scaffolding.
# 4. Valide a topologia no final utilizando o Antigravity CLI.
# ---------------------------------------------------------------------------

phases:
  - name: 01-workspace-initialization
    description: "Inicializa a malha de observabilidade e FinOps"
    execution:
      type: shell
      commands:
        - "ag init agents --strategy event-driven"
        - "ag config set telemetry.enabled true"
        - "ag config set finops.budget.action alert_and_throttle"

  - name: 02-structural-scaffolding
    description: "Criação da árvore de diretórios conforme plano de instrumentação"
    execution:
      type: shell
      commands:
        # Diretórios de documentação e produto
        - "mkdir -p docs/product/roadmaps/"
        - "mkdir -p docs/engineering/adrs/"
        - "mkdir -p docs/engineering/qa_plans/"
        # Diretórios de agentes e skills
        - "mkdir -p .agents/arch .agents/eng .agents/prod .agents/qa .agents/fiscal"
        - "mkdir -p .agents/skills/adonis-backend"
        - "mkdir -p .agents/skills/tailwind-frontend"
        - "mkdir -p .agents/skills/japa-qa"
        - "mkdir -p .agents/skills/fiscal-domain"
        - "mkdir -p .agents/skills/adr-generator"
        # Criação de placeholders para rules globais e docs core
        - "touch AGENTS.md README.md docs/instrumentation.md docs/scope.md"
        - "touch docs/engineering/constitution.md docs/engineering/architecture_map.md docs/product/features_map.md"

  - name: 03-mcp-and-hooks-configuration
    description: "Configuração do Model Context Protocol e Guardrails"
    execution:
      type: file-generation
      files:
        - path: ".agents/mcp.json"
          content: |
            {
              "mcp_servers": {
                "postgres-heroku": {
                  "type": "database",
                  "description": "MCP para PostgreSQL (Heroku).",
                  "connection_env": ["DATABASE_URL", "DATABASE_SCHEMA"]
                }
              }
            }
        - path: ".agents/hooks.json"
          content: |
            {
              "hooks": [
                {
                  "name": "constitution-guard",
                  "trigger": "PreToolUse",
                  "description": "Valida uso exclusivo do schema 'tavolo' e ausência de schema public antes da escrita de código."
                },
                {
                  "name": "adr-prerequisite",
                  "trigger": "PreToolUse",
                  "description": "Verifica existência de ADR correspondente antes da geração de controllers ou models."
                }
              ]
            }

  - name: 04-skills-injection
    description: "Provisionamento das habilidades granulares de domínio"
    execution:
      type: file-generation
      files:
        - path: ".agents/skills/adonis-backend/SKILL.md"
          content: "# Padrões AdonisJS v6\n- Controladores finos, lógicas em app/services/.\n- Acesso a banco 100% via Lucid ORM.\n- Validação via Vine.js.\n- Regra rígida: schema PostgreSQL = tavolo."
        - path: ".agents/skills/tailwind-frontend/SKILL.md"
          content: "# Padrões Edge.js e Tailwind CSS\n- Views em resources/views/ com sintaxe Edge.\n- Classes utilitárias do TailwindCSS para responsividade.\n- Componentização Edge para reuso."
        - path: ".agents/skills/japa-qa/SKILL.md"
          content: "# Padrões Japa Testing\n- Testes funcionais e unitários (TDD puro preferido).\n- Zero acoplamento de banco de dados onde possível.\n- Suítes separadas (unit / functional)."
        - path: ".agents/skills/fiscal-domain/SKILL.md"
          content: "# Padrões do Módulo Fiscal\n- Emissão de NFC-e/NF-e com regras da SEFAZ multi-UF.\n- Assinatura XML (certificado A1) e validação XSD.\n- Atenção especial ao FISCAL_ENCRYPTION_KEY e rotinas de contingência."
        - path: ".agents/skills/adr-generator/SKILL.md"
          content: "# Template de ADR\n- Seções obrigatórias: Contexto, Decisão, Trade-offs, Consequências, Status. Nomenclatura NNN_nome.md."

  - name: 05-agents-manifests
    description: "Instanciação dos subagentes no workspace"
    execution:
      type: file-generation
      files:
        - path: ".agents/prod/agent.md"
          content: "> [!NOTE]\n> Agente configurado via runbook. Referência ao manifesto Antigravity principal de produto (Tavolo ERP)."
        - path: ".agents/arch/agent.md"
          content: "> [!NOTE]\n> Agente configurado via runbook. Referência ao manifesto Antigravity principal de arquitetura do AdonisJS/Postgres."
        - path: ".agents/eng/agent.md"
          content: "> [!NOTE]\n> Agente configurado via runbook. Referência ao manifesto Antigravity principal de engenharia fullstack."
        - path: ".agents/qa/agent.md"
          content: "> [!NOTE]\n> Agente configurado via runbook. Referência ao manifesto Antigravity principal de testes automatizados com Japa."
        - path: ".agents/fiscal/agent.md"
          content: "> [!NOTE]\n> Agente especializado no contexto fiscal crítico (SEFAZ, NFC-e, XML, A1)."

  - name: 06-final-binding
    description: "Aplica e valida a configuração na CLI"
    execution:
      type: shell
      commands:
        # Vincula os servidores MCP descritos no JSON
        - "ag mcp apply -f .agents/mcp.json"
        # Habilita os hooks de segurança (Constitution Guard)
        - "ag hooks apply -f .agents/hooks.json"
        # Realiza a validação da topologia
        - "ag status --check-topology"