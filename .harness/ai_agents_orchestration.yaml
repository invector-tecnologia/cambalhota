pipeline:
  name: AI Agents Event-Driven Orchestration
  identifier: ai_agents_orchestration
  projectIdentifier: VeterinCore
  orgIdentifier: Engineering
  tags:
    finops_center: engineering-leadership
  properties:
    ci:
      codebase:
        connectorRef: org.git_connector
        build: <+input>
  stages:
    - stage:
        name: Subagent Dispatch
        identifier: subagent_dispatch
        type: CI
        spec:
          execution:
            steps:
              - step:
                  type: Run
                  name: Antigravity CLI Execution
                  identifier: ag_cli_exec
                  spec:
                    # Imagem efêmera contendo a CLI e ferramentas básicas (cargo, flutter, docker)
                    connectorRef: org.docker_registry
                    image: antigravity/runner:latest
                    envVariables:
                      # Telemetria: Injeta o ID da execução do Harness como Correlation ID para o AI Gateway
                      AG_TELEMETRY_TRACE_ID: <+pipeline.executionId>
                      AG_TELEMETRY_ENDPOINT: "https://ai-gateway.internal:4317"
                      
                      # Secrets: Injetados via Harness Vault para uso dos servidores MCP
                      GITHUB_TOKEN: <+secrets.getValue("github_token_ag")>
                      GEMINI_API_KEY: <+secrets.getValue("gemini_api_key_prod")>
                      SEARCH_API_KEY: <+secrets.getValue("google_search_api")>
                      
                    command: |
                      # 1. Recupera o payload JSON bruto do webhook que acionou o pipeline
                      WEBHOOK_PAYLOAD_PATH="/tmp/webhook_payload.json"
                      echo '<+trigger.payload>' > $WEBHOOK_PAYLOAD_PATH
                      
                      # 2. Executa a CLI em modo de orquestração automática.
                      # A CLI lerá os manifestos em .ag/agents/, cruzará os triggers com o arquivo payload
                      # e executará apenas o agente correspondente (com cache de contexto habilitado).
                      ag agent dispatch --payload-file $WEBHOOK_PAYLOAD_PATH --apply-limits